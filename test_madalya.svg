<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200">
    <style>
        .bg { fill: #050a05; }
        .text-neon { fill: #39ff14; font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 14px;}
        .text-dim { fill: #1a4d1a; font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 14px;}
        .box-medal-earned { fill: rgba(57, 255, 20, 0.05); stroke: #39ff14; stroke-width: 1; }
        .box-medal-locked { fill: transparent; stroke: #1a4d1a; stroke-width: 1; stroke-dasharray: 4; }
    </style>
    <rect width="100%" height="100%" class="bg" />
    <text x="25" y="30" class="text-neon">EPIC MEDAL SLOTS SHOWCASE ROOM</text>
    <rect x="25" y="60" width="200" height="65" rx="3" ry="3" class="box-medal-earned" />
<text x="35" y="82" class="text-neon">◆ [RANK]</text>
<text x="35" y="102" class="text-neon" font-size="12">ROOKIE</text>
<text x="35" y="118" class="text-neon" font-size="10">[UNLOCKED]</text>
<rect x="250" y="60" width="200" height="65" rx="3" ry="3" class="box-medal-locked" />
<text x="260" y="82" class="text-dim">▲▲▲ [GOAL]</text>
<text x="260" y="102" class="text-dim" font-size="12">SERGEANT</text>
<text x="260" y="118" class="text-dim" font-size="10">[TARGET: 30]</text>
<rect x="475" y="60" width="200" height="65" rx="3" ry="3" class="box-medal-locked" />
<text x="485" y="82" class="text-dim">🛡️ [DEFENSE]</text>
<text x="485" y="102" class="text-dim" font-size="12">IRON SENTRY</text>
<text x="485" y="118" class="text-dim" font-size="10">[TARGET: 50]</text>
<rect x="700" y="60" width="200" height="65" rx="3" ry="3" class="box-medal-locked" />
<text x="710" y="82" class="text-dim">🗡️ [COMMIT]</text>
<text x="710" y="102" class="text-dim" font-size="12">FLESH RIPPER</text>
<text x="710" y="118" class="text-dim" font-size="10">[TARGET: 100]</text>
</svg>