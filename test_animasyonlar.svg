<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">
    <style>
        .bg { fill: #050a05; }
        .text-neon { fill: #39ff14; font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 14px;}
        .text-medal { font-size: 12px; }
        .intel-panel { fill: rgba(13, 17, 23, 0.8); stroke: #1a4d1a; stroke-width: 1; rx: 4; ry: 4; }
    </style>
    <rect width="100%" height="100%" class="bg" />
    <text x="20" y="30" class="text-neon">ANIMATION SHOWCASE ROOM</text>
    
    <rect x="20" y="50" width="240" height="140" class="intel-panel" />
        <text x="30" y="70" class="text-neon text-medal">LIVE CAM: SQUAD EN ROUTE</text>
        <line x1="40" y1="120" x2="220" y2="120" stroke="#1a4d1a" stroke-dasharray="5,5" stroke-width="2" />
        <circle cx="40" cy="120" r="6" fill="#39ff14">
            <animate attributeName="cx" values="40;220;40" dur="6s" repeatCount="indefinite" />
        </circle>
        <rect x="215" y="115" width="10" height="10" fill="#ff003c" opacity="0.7" />
        <text x="200" y="145" class="text-neon" font-size="10">TARGET</text>
        
    <rect x="280" y="50" width="240" height="140" class="intel-panel" />
        <text x="290" y="70" class="text-neon text-medal">LIVE CAM: ENGAGING HORDE</text>
        <!-- Barricade -->
        <rect x="320" y="100" width="15" height="60" fill="#285473" />
        <!-- Muzzle Flashes -->
        <line x1="335" y1="110" x2="500" y2="110" stroke="#39ff14" stroke-width="2" opacity="0">
            <animate attributeName="opacity" values="0;1;0;0" dur="0.2s" repeatCount="indefinite" />
        </line>
        <line x1="335" y1="140" x2="500" y2="140" stroke="#39ff14" stroke-width="2" opacity="0">
            <animate attributeName="opacity" values="0;0;0;1;0" dur="0.35s" repeatCount="indefinite" />
        </line>
        <!-- Zombies Approaching -->
        <circle cx="510" cy="110" r="5" fill="#ff003c">
             <animate attributeName="cx" values="510;340" dur="1.5s" repeatCount="indefinite" />
        </circle>
        <circle cx="480" cy="140" r="5" fill="#ff003c">
             <animate attributeName="cx" values="480;340" dur="2.1s" repeatCount="indefinite" />
        </circle>
        
    <rect x="20" y="210" width="240" height="140" class="intel-panel" />
        <text x="30" y="230" class="text-neon text-medal">LIVE CAM: SECTOR SECURE</text>
        <text x="140" y="325" class="text-neon" font-size="14" text-anchor="middle">
            <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
            CAMP ESTABLISHED
        </text>
        <!-- Campfire -->
        <polygon points="130,300 140,270 150,300" fill="#ff8c00">
            <animate attributeName="points" values="130,300 140,270 150,300; 130,300 140,285 150,300; 130,300 140,270 150,300" dur="0.6s" repeatCount="indefinite" />
        </polygon>
        <rect x="125" y="300" width="30" height="6" fill="#4a3b2c" />
        
    
    <rect x="280" y="210" width="240" height="175" class="intel-panel" />
    <text x="290" y="230" class="text-neon text-medal">LOCAL RADAR [50M RADIUS]</text>
    <circle cx="400" cy="300" r="65" stroke="#1a4d1a" stroke-width="1" fill="none" />
    <circle cx="400" cy="300" r="45" stroke="#1a4d1a" stroke-width="1" fill="none" />
    <circle cx="400" cy="300" r="25" stroke="#1a4d1a" stroke-width="1" fill="none" />
    <line x1="400" y1="235" x2="400" y2="365" stroke="#1a4d1a" stroke-width="1" />
    <line x1="335" y1="300" x2="465" y2="300" stroke="#1a4d1a" stroke-width="1" />
    
    <g>
        <path d="M 400 300 L 400 235 A 65 65 0 0 1 465 300 Z" fill="rgba(57, 255, 20, 0.15)" />
        <animateTransform attributeName="transform" type="rotate" from="0 400 300" to="360 400 300" dur="4s" repeatCount="indefinite" />
    </g>
    
    <circle cx="370" cy="260" r="3" fill="#ff003c">
        <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="440" cy="320" r="3" fill="#ff003c">
        <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="385" cy="350" r="3" fill="#ff003c">
        <animate attributeName="opacity" values="0;1;0" dur="4s" begin="3.5s" repeatCount="indefinite" />
    </circle>
    
    </svg>
    