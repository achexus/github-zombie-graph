<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">
    <style>
        .bg { fill: #050a05; }
        .text-neon { fill: #39ff14; font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 14px;}
        .text-medal { font-size: 12px; }
        .intel-panel { fill: rgba(13, 17, 23, 0.8); stroke: #1a4d1a; stroke-width: 1; rx: 4; ry: 4; }
    </style>
    <rect width="100%" height="100%" class="bg" />
    <text x="20" y="30" class="text-neon">ANIMATION SHOWCASE ROOM</text>
    
    <rect x="20" y="50" width="265" height="164" class="intel-panel" />
        <text x="35" y="75" class="text-neon text-medal">LIVE CAM: SQUAD EN ROUTE</text>
        <line x1="30" y1="180" x2="275" y2="180" stroke="#39ff14" stroke-dasharray="15, 10" stroke-width="2">
            <animate attributeName="stroke-dashoffset" from="25" to="0" dur="0.4s" repeatCount="indefinite" />
        </line>
        <g>
            <animate attributeName="transform" type="translate" values="0,0; 0,2; 0,0" dur="0.2s" repeatCount="indefinite" />
            <path d="M 70 160 L 90 130 L 150 130 L 170 160 L 190 160 L 190 175 L 70 175 Z" fill="#285473" />
            <rect x="100" y="135" width="20" height="15" fill="#0d1117" />
            <rect x="130" y="135" width="20" height="15" fill="#0d1117" />
            <circle cx="100" cy="175" r="10" fill="#0d1117" stroke="#39ff14" stroke-width="2" />
            <circle cx="160" cy="175" r="10" fill="#0d1117" stroke="#39ff14" stroke-width="2" />
        </g>
        
    <rect x="300" y="50" width="265" height="164" class="intel-panel" />
        <text x="315" y="75" class="text-neon text-medal">LIVE CAM: THERMAL SCOPE (ENGAGING)</text>
        <rect x="310" y="90" width="245" height="114" fill="#0a0a2a" rx="4" ry="4" />
        <circle cx="530" cy="150" r="8" fill="#ff8c00" opacity="0.8">
             <animate attributeName="cx" values="550;340" dur="4s" repeatCount="indefinite" />
             <animate attributeName="cy" values="150;145;150" dur="0.5s" repeatCount="indefinite" />
        </circle>
        <circle cx="480" cy="170" r="10" fill="#ff003c" opacity="0.9">
             <animate attributeName="cx" values="550;340" dur="5s" repeatCount="indefinite" />
             <animate attributeName="cy" values="170;165;170" dur="0.7s" repeatCount="indefinite" />
        </circle>
        <g stroke="#39ff14" stroke-width="1.5">
            <animate attributeName="transform" type="translate" values="0,0; -8,-8; 0,0; 0,0" dur="2.5s" keyTimes="0; 0.05; 0.15; 1" repeatCount="indefinite" />
            <circle cx="432.5" cy="145" r="45" fill="rgba(57,255,20,0.05)" />
            <line x1="372.5" y1="145" x2="492.5" y2="145" />
            <line x1="432.5" y1="85" x2="432.5" y2="205" />
            <circle cx="432.5" cy="145" r="2" fill="#ff003c" stroke="none">
                <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite" />
            </circle>
        </g>
        
    <rect x="20" y="230" width="265" height="164" class="intel-panel" />
        <text x="35" y="255" class="text-neon text-medal">LIVE CAM: SECTOR SECURE (CITY)</text>
        <path d="M 40 375 L 40 310 L 60 310 L 60 290 L 90 290 L 90 320 L 120 320 L 120 280 L 160 280 L 160 330 L 190 330 L 190 300 L 230 300 L 230 375 Z" fill="#1c3242" />
        <rect x="50" y="320" width="4" height="4" fill="#39ff14" opacity="0.6" />
        <rect x="100" y="330" width="4" height="4" fill="#39ff14" opacity="0.6" />
        <rect x="170" y="310" width="4" height="4" fill="#39ff14" opacity="0.6" />
        <polygon points="140,375 60,270 220,270" fill="rgba(57, 255, 20, 0.15)">
            <animate attributeName="points" values="140,375 60,270 220,270; 140,375 120,260 280,260; 140,375 60,270 220,270" dur="6s" repeatCount="indefinite" />
        </polygon>
        <text x="152" y="360" class="text-neon" font-size="12" text-anchor="middle">SAFE ZONE</text>
        
    
    <rect x="300" y="230" width="265" height="164" class="intel-panel" />
    <text x="315" y="255" class="text-neon text-medal">LOCAL RADAR [50M RADIUS]</text>
    <circle cx="432.5" cy="325" r="55" stroke="#1a4d1a" stroke-width="1" fill="none" />
    <circle cx="432.5" cy="325" r="35" stroke="#1a4d1a" stroke-width="1" fill="none" />
    <circle cx="432.5" cy="325" r="15" stroke="#1a4d1a" stroke-width="1" fill="none" />
    <line x1="432.5" y1="270" x2="432.5" y2="380" stroke="#1a4d1a" stroke-width="1" />
    <line x1="377.5" y1="325" x2="487.5" y2="325" stroke="#1a4d1a" stroke-width="1" />
    <g>
        <path d="M 432.5 325 L 432.5 270 A 55 55 0 0 1 487.5 325 Z" fill="rgba(57, 255, 20, 0.15)" />
        <animateTransform attributeName="transform" type="rotate" from="0 432.5 325" to="360 432.5 325" dur="3.5s" repeatCount="indefinite" />
    </g>
    
        <circle cx="392.5" cy="290" r="4" fill="#ff003c">
            <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.0s" repeatCount="indefinite" />
        </circle>
        
        <circle cx="467.5" cy="345" r="4" fill="#ff003c">
            <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.7s" repeatCount="indefinite" />
        </circle>
        
        <circle cx="417.5" cy="370" r="4" fill="#ff003c">
            <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.4s" repeatCount="indefinite" />
        </circle>
        
        <circle cx="477.5" cy="300" r="4" fill="#ff003c">
            <animate attributeName="opacity" values="0;1;0" dur="3s" begin="2.0999999999999996s" repeatCount="indefinite" />
        </circle>
        
     
    </svg>
    